services:
  station:
    build: .
    image: mars-communication-station:1.0.0
    container_name: mars-station
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    # Inside the container "localhost" is the container itself. A service on
    # this machine — Home Assistant on localhost:8088 — is reached as
    # host.docker.internal (HA_HOST=host.docker.internal in .env); this line
    # makes that name work on Linux too.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # --- the mission -----------------------------------------------------
      # The run — Thu 15 to Tue 27 October 2026, thirteen days, Europe/Berlin —
      # is fixed in src/lib/run.js and is not read from .env. To rehearse
      # against other dates set MISSION_OVERRIDE=true, MISSION_START and
      # MISSION_END in .env; without MISSION_OVERRIDE they are ignored.
      MISSION_NAME: "${MISSION_NAME:-MARS — HABITAT ONE}"
      MISSION_OVERRIDE: "${MISSION_OVERRIDE:-false}"
      MISSION_START: "${MISSION_START:-}"
      MISSION_END: "${MISSION_END:-}"
      TZ: "Europe/Berlin"

      # --- access ----------------------------------------------------------
      # The one account that opens mission control (/control) and the habitat
      # terminal (/log): CONTROL_USER and CONTROL_PASSWORD in .env. The older
      # names ADMIN_USER / ADMIN_PASSWORD are still read when those are absent.
      CONTROL_USER: "${CONTROL_USER:-}"
      CONTROL_PASSWORD: "${CONTROL_PASSWORD:-}"
      ADMIN_USER: "${ADMIN_USER:-control}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
      SENSOR_TOKEN: "${SENSOR_TOKEN:?set SENSOR_TOKEN in .env}"
      IP_SALT: "${IP_SALT:-change-me}"
      SECURE_COOKIES: "${SECURE_COOKIES:-false}"

      # --- behaviour -------------------------------------------------------
      TRANSIT_SECONDS: "${TRANSIT_SECONDS:-12}"
      MESSAGE_MAX_CHARS: "${MESSAGE_MAX_CHARS:-500}"
      HOURLY_LIMIT: "${HOURLY_LIMIT:-6}"
      SENSOR_STALE_SECONDS: "${SENSOR_STALE_SECONDS:-300}"
      MEDIA_MAX_MB: "${MEDIA_MAX_MB:-4096}"
      HOLD_CHANNEL_BEFORE_LAUNCH: "${HOLD_CHANNEL_BEFORE_LAUNCH:-false}"
      WATCH_CONTENT: "${WATCH_CONTENT:-true}"

      # --- the habitat readings --------------------------------------------
      # Which source feeds the habitat's readings: "auto" (the habitat sensor
      # through Home Assistant whenever HA_HOST and HA_API_TOKEN are set and
      # content/home-assistant.json maps the entities, the node otherwise),
      # "home-assistant", or "node"; and how often the sensor is read.
      HABITAT_SOURCE: "${HABITAT_SOURCE:-auto}"
      HABITAT_POLL_MS: "${HABITAT_POLL_MS:-60000}"
      # The external node (critical-sensors.de) and where the readings start;
      # see README "Where the readings start". Set in .env.
      CRITICAL_POLL: "${CRITICAL_POLL:-true}"
      CRITICAL_URL: "${CRITICAL_URL:-https://critical-sensors.de/srv.php}"
      CRITICAL_SENSOR_ID: "${CRITICAL_SENSOR_ID:-11}"
      CRITICAL_POLL_MS: "${CRITICAL_POLL_MS:-900000}"
      READINGS_DAYS_BEFORE: "${READINGS_DAYS_BEFORE:-0}"
      READINGS_FROM: "${READINGS_FROM:-}"
      # Rehearsal only: moves the instant the record closes (the end of
      # 27 October 2026, after which nothing is updated by automation).
      CRITICAL_FREEZE_AT: "${CRITICAL_FREEZE_AT:-}"

      # --- the cloud gallery (WebDAV) ----------------------------------------
      # Credentials for the display account on the ZKM cloud come from .env
      # and stay out of the repository; the folder is a path inside it.
      CLOUD_URL: "${CLOUD_URL:-https://cloud.zkm.de}"
      CLOUD_USER: "${CLOUD_USER:-}"
      CLOUD_PASSWORD: "${CLOUD_PASSWORD:-}"
      CLOUD_FOLDER: "${CLOUD_FOLDER:-}"
      CLOUD_TITLE: "${CLOUD_TITLE:-Gallery}"
      CLOUD_CHECK_SECONDS: "${CLOUD_CHECK_SECONDS:-900}"
      CLOUD_POLL: "${CLOUD_POLL:-true}"
      # If the folder is mounted on the host instead (davfs2), add a volume
      # below, e.g.  - /path/to/your/mountpoint:/cloud:ro  and set
      # CLOUD_DIR=/cloud in .env; user and password are then not needed.
      CLOUD_DIR: "${CLOUD_DIR:-}"

      # --- the habitat's own hardware (Home Assistant) -----------------------
      # Host, port and token come from .env and stay out of the repository;
      # which sensors are read lives in content/home-assistant.json. Without
      # host and token the bridge is off and the panel stays off the page.
      LISTEN_HOST: "${LISTEN_HOST:-0.0.0.0}"
      HA_HOST: "${HA_HOST:-}"
      HA_PORT: "${HA_PORT:-80}"
      HA_API_TOKEN: "${HA_API_TOKEN:-}"
      HA_POLL_MS: "${HA_POLL_MS:-900000}"
      HA_POLL: "${HA_POLL:-true}"
    volumes:
      - station-data:/data
      # The mission content is mounted, not baked in: edit the files on your
      # machine and the running site updates within a couple of seconds.
      - ./content:/app/content
      # The code (src/ and public/) is mounted from this folder as well, so an
      # edit to a page script is live on the next reload and a change to the
      # server is picked up by:  docker compose restart
      # The image still carries a copy: comment these two lines out before
      # the run and rebuild once (docker compose up --build -d) to ship the
      # code baked in, with nothing on the venue machine to drift.
      - ./src:/app/src
      - ./public:/app/public

  # Optional. Feeds plausible habitat readings so the site can be demonstrated
  # or rehearsed before the real sensors are mounted:
  #   docker compose --profile demo up
  simulator:
    build: .
    image: mars-communication-station:1.0.0
    container_name: mars-simulator
    restart: unless-stopped
    profiles: ["demo"]
    depends_on:
      station:
        condition: service_healthy
    environment:
      STATION_URL: "http://station:8080"
      SENSOR_TOKEN: "${SENSOR_TOKEN:?set SENSOR_TOKEN in .env}"
      INTERVAL_SECONDS: "${SIM_INTERVAL:-30}"
    entrypoint: ["node", "tools/simulate-sensors.js"]

volumes:
  station-data:
